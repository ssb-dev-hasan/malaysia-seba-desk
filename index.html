<!DOCTYPE html>
<html lang="bn" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#047857">
    <title>প্রবাসী সেবা ডেস্ক</title>
    <link rel="manifest" href="manifest.json">
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Pro/Free Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Font (Hind Siliguri) -->
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Hind Siliguri', 'sans-serif'] },
                    colors: {
                        brand: { 50: '#ecfdf5', 100: '#d1fae5', 600: '#059669', 700: '#047857', 800: '#065f46', 900: '#064e3b' }
                    }
                }
            }
        }
    </script>
    <style>
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .glass-card { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); }
    </style>
</head>
<body class="h-full bg-slate-100 text-slate-800 flex flex-col justify-between selection:bg-brand-100 selection:text-brand-800">

    <!-- Top Header -->
    <header class="bg-gradient-to-r from-brand-900 via-brand-800 to-brand-700 text-white shadow-lg sticky top-0 z-50">
        <div class="max-w-md mx-auto px-4 py-3.5 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="w-10 h-10 rounded-xl bg-white/10 flex items-center justify-center text-brand-100 text-xl border border-white/20">
                    <i class="fas fa-passport"></i>
                </div>
                <div>
                    <h1 class="text-lg font-bold tracking-tight leading-tight">প্রবাসী সেবা ডেস্ক</h1>
                    <p class="text-[11px] text-brand-100/80 font-medium">মালয়েশিয়া প্রবাসীদের জরুরি পোর্টাল</p>
                </div>
            </div>
            <div class="flex items-center space-x-2">
                <span class="relative flex h-3 w-3">
                  <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
                  <span class="relative inline-flex rounded-full h-3 w-3 bg-emerald-500"></span>
                </span>
                <span class="text-xs font-semibold text-emerald-200">লাইভ</span>
            </div>
        </div>
    </header>

    <!-- Search & Filter Section -->
    <div class="bg-white border-b border-slate-200 sticky top-[65px] z-40 shadow-sm">
        <div class="max-w-md mx-auto p-3 space-y-2.5">
            <!-- Search Bar -->
            <div class="relative">
                <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
                    <i class="fas fa-search text-sm"></i>
                </span>
                <input type="text" id="search-input" oninput="handleSearch()" placeholder="সেবা বা দপ্তর খুঁজুন (যেমন: পাসপোর্ট, ভিসা)..." 
                    class="w-full pl-10 pr-4 py-2 bg-slate-100 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-brand-600 focus:bg-white transition">
            </div>

            <!-- Dynamic Category Chips -->
            <div id="category-tabs" class="flex overflow-x-auto no-scrollbar space-x-2 pb-1">
                <button onclick="filterCategory('all', this)" class="cat-btn active bg-brand-700 text-white px-4 py-1.5 rounded-full text-xs font-semibold whitespace-nowrap shadow-sm transition">
                    সকল সেবা
                </button>
            </div>
        </div>
    </div>

    <!-- Main Content Area -->
    <main class="max-w-md w-full mx-auto p-4 flex-1 overflow-y-auto">
        
        <!-- Loading State -->
        <div id="loader" class="flex flex-col items-center justify-center py-20 text-brand-700">
            <i class="fas fa-circle-notch fa-spin text-3xl mb-3"></i>
            <p class="text-xs font-medium text-slate-500">অফিসিয়াল ডেটা লোড হচ্ছে...</p>
        </div>

        <!-- Dynamic Module Cards Grid -->
        <div id="module-container" class="space-y-3"></div>

        <!-- Empty State -->
        <div id="empty-state" class="hidden text-center py-16">
            <div class="w-16 h-16 bg-slate-200 text-slate-400 rounded-full flex items-center justify-center mx-auto mb-3 text-2xl">
                <i class="fas fa-folder-open"></i>
            </div>
            <p class="text-sm font-medium text-slate-600">কোনো সেবা বা মডিউল পাওয়া যায়নি</p>
        </div>
    </main>

    <!-- Footer -->
    <footer class="bg-white border-t border-slate-200 py-3 text-center text-[11px] text-slate-500 font-medium">
        প্যাকেজ: <span class="text-slate-700 font-bold">com.probashisebadesk.my</span> • সিকিউরড ক্লাউড বেসড
    </footer>

    <!-- Firebase SDK Setup & Logic (Notification Included) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, getDocs, query, orderBy, where } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
        import { getMessaging, getToken } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-messaging.js";

        // আপনার ফায়ারবেজ কনফিগারেশন এখানে বসান
        const firebaseConfig = {
  apiKey: "AIzaSyC0Bdfcw2qf3pGXgvWCJtNOFGV4fJJt34s",
  authDomain: "probashi-seba-desk.firebaseapp.com",
  projectId: "probashi-seba-desk",
  storageBucket: "probashi-seba-desk.firebasestorage.app",
  messagingSenderId: "450175481492",
  appId: "1:450175481492:web:f63eae5a3336fffb452681",
  measurementId: "G-8KNM1F5JNM"
};

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const messaging = getMessaging(app);

        let allModules = [];
        let currentCategory = 'all';
        const container = document.getElementById('module-container');
        const loader = document.getElementById('loader');
        const emptyState = document.getElementById('empty-state');
        const categoryTabs = document.getElementById('category-tabs');

        // Request Push Notification Permission
        async function requestNotificationPermission() {
            try {
                const permission = await Notification.requestPermission();
                if (permission === 'granted') {
                    const token = await getToken(messaging, { vapidKey: 'YOUR_PUBLIC_VAPID_KEY_HERE' });
                    console.log('FCM Token:', token);
                }
            } catch (error) {
                console.error('Notification Permission Error:', error);
            }
        }

        async function fetchModules() {
            try {
                const q = query(collection(db, "malaysia_services"), where("active", "==", true), orderBy("order", "asc"));
                const snapshot = await getDocs(q);
                
                allModules = [];
                const categories = new Set();

                snapshot.forEach((doc) => {
                    const data = doc.data();
                    allModules.push(data);
                    if (data.category) categories.add(data.category);
                });

                renderCategories(categories);
                renderCards(allModules);
                loader.classList.add('hidden');

            } catch (error) {
                console.error("Firebase Error:", error);
                loader.innerHTML = `<div class="text-red-500 text-center text-xs"><i class="fas fa-exclamation-triangle text-xl mb-1"></i><p>ডেটা লোড করতে সমস্যা হয়েছে। ইন্টারনেট সংযোগ বা ফায়ারবেজ রুলস চেক করুন।</p></div>`;
            }
        }

        function renderCategories(categories) {
            categories.forEach(cat => {
                const btn = document.createElement('button');
                btn.className = "cat-btn bg-white border border-slate-200 text-slate-600 hover:bg-slate-50 px-4 py-1.5 rounded-full text-xs font-semibold whitespace-nowrap shadow-sm transition";
                btn.innerText = cat;
                btn.onclick = () => filterCategory(cat, btn);
                categoryTabs.appendChild(btn);
            });
        }

        window.filterCategory = function(category, clickedBtn) {
            currentCategory = category;
            document.querySelectorAll('.cat-btn').forEach(btn => {
                btn.classList.remove('bg-brand-700', 'text-white', 'border-transparent');
                btn.classList.add('bg-white', 'border-slate-200', 'text-slate-600');
            });

            if (clickedBtn) {
                clickedBtn.classList.remove('bg-white', 'border-slate-200', 'text-slate-600');
                clickedBtn.classList.add('bg-brand-700', 'text-white', 'border-transparent');
            }

            applyFilters();
        };

        window.handleSearch = function() {
            applyFilters();
        };

        function applyFilters() {
            const searchTerm = document.getElementById('search-input').value.toLowerCase();
            
            let filtered = allModules.filter(item => {
                const matchesCategory = currentCategory === 'all' || item.category === currentCategory;
                const matchesSearch = item.title.toLowerCase().includes(searchTerm) || (item.subtitle && item.subtitle.toLowerCase().includes(searchTerm));
                return matchesCategory && matchesSearch;
            });

            renderCards(filtered);
        }

        function renderCards(modules) {
            container.innerHTML = "";
            if (modules.length === 0) {
                emptyState.classList.remove('hidden');
                return;
            }
            emptyState.classList.add('hidden');

            modules.forEach(item => {
                const card = document.createElement('a');
                card.href = item.url;
                card.target = "_blank";
                card.rel = "noopener noreferrer";
                card.className = "flex items-center p-3.5 bg-white rounded-2xl shadow-sm border border-slate-200/80 hover:shadow-md hover:border-brand-600/30 active:scale-[0.98] transition-all duration-200 group";
                
                card.innerHTML = `
                    <div class="w-12 h-12 rounded-xl flex items-center justify-center text-lg mr-3.5 shrink-0 transition group-hover:scale-105" 
                         style="background-color: ${item.bgColor || '#ecfdf5'}; color: ${item.iconColor || '#047857'};">
                        <i class="fas ${item.icon || 'fa-link'}"></i>
                    </div>
                    <div class="flex-1 min-w-0">
                        <div class="flex items-center space-x-2">
                            <h2 class="font-bold text-slate-800 text-sm tracking-tight truncate">${item.title}</h2>
                            ${item.badge ? `<span class="bg-rose-50 text-rose-600 text-[10px] font-bold px-2 py-0.5 rounded-full border border-rose-100">${item.badge}</span>` : ''}
                        </div>
                        <p class="text-[11px] text-slate-500 line-clamp-1 mt-0.5">${item.subtitle || item.category}</p>
                    </div>
                    <div class="w-7 h-7 rounded-full bg-slate-50 flex items-center justify-center text-slate-400 ml-2 group-hover:bg-brand-50 group-hover:text-brand-600 transition">
                        <i class="fas fa-chevron-right text-xs"></i>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        // Call notification permission request on load along with fetch
        window.addEventListener('load', () => {
            requestNotificationPermission();
            fetchModules();
        });

        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js');
        }
    </script>
</body>
</html>
