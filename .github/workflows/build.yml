name: Build Android APK and AAB

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Prepare Web Folder
      run: |
        mkdir -p www
        cp index.html manifest.json sw.js www/

    - name: Install Dependencies
      run: npm install

    - name: Initialize Capacitor & Add Android
      run: |
        npx cap init "প্রবাসী সেবা ডেস্ক" "com.probashisebadesk.my" --web-dir www
        npx cap add android

    - name: Build Debug APK
      run: |
        cd android
        ./gradlew assembleDebug

    - name: Build Release AAB
      run: |
        cd android
        ./gradlew bundleRelease

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Probashi-Seba-Desk-APK
        path: android/app/build/outputs/apk/debug/app-debug.apk

    - name: Upload AAB Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Probashi-Seba-Desk-AAB
        path: android/app/build/outputs/bundle/release/app-release.aab
        
